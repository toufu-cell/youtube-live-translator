<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubeライブ英日字幕</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
<header><span class="mark" aria-hidden="true"></span><h1>ライブ英日字幕</h1></header>
<p class="lead">視聴中の動画に、日本語字幕を重ねます。</p>
<div class="actions">
<button id="prepare" type="button">モデルを事前準備</button>
<button id="start" type="button" class="primary">この動画で開始</button>
<button id="stop" type="button">翻訳を停止</button>
</div>
<section class="status-section" aria-label="動作状態">
<span class="section-label">状態</span>
<p id="status" role="status" aria-live="polite">確認中…</p>
</section>
<section class="settings" aria-label="字幕の設定">
<label for="size">文字サイズ</label>
<select id="size"><option value="18">小18</option><option value="22">標準22</option><option value="26">大26</option><option value="30">特大30</option><option value="36">最大36</option></select>
<label for="position">表示位置</label>
<select id="position"><option value="bottom">動画の下部</option><option value="middle">動画の中央寄り</option></select>
</section>
<div class="preview" aria-label="字幕の表示例"><span>ここに日本語字幕を表示します。<br>続く発言で内容を更新します。</span></div>
<p class="footnote">初回はモデルの取得に時間がかかります。</p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
